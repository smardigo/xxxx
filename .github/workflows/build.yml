name: Build PDV Assuncao Installer

on:
  push:
    tags:
      - 'v*' # Roda automaticamente ao criar uma tag (ex: v1.0.0)
  workflow_dispatch: # Permite rodar o workflow manualmente com um botão no GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. ETAPA PYTHON: COMPILA O BACKEND ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # Força a instalação das dependências para evitar o erro "PackageNotFoundError"
          pip install fastapi uvicorn motor pymongo dnspython pydantic starlette
          
          # Instala outras dependências se houver o requirements.txt na raiz
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          
          pip install pyinstaller

      - name: Build Python Backend
        # Usa o seu arquivo .spec para gerar a build
        run: pyinstaller server.spec --noconfirm

      # --- 2. ETAPA REACT: COMPILA O FRONTEND ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build

      # --- 3. ETAPA ELECTRON: GERA O INSTALADOR ---
      - name: Build Electron Installer
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-PDV-Assuncao
          # Busca o executável na pasta dist_electron dentro de frontend
          path: frontend/dist_electron/*.exe
