name: Build PDV Assuncao Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. ETAPA PYTHON: COMPILA O BACKEND ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn motor pymongo dnspython pydantic starlette
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Python Backend
        working-directory: ./backend
        run: pyinstaller server.py --name server --onefile --noconsole --hidden-import=pymongo --hidden-import=motor --hidden-import=dns --hidden-import=motor.motor_asyncio

      # --- 2. ETAPA REACT: COMPILA O FRONTEND ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # As linhas de cache foram removidas daqui para evitar o erro do yarn.lock

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: yarn install

      - name: Build React Frontend
        working-directory: ./frontend
        run: yarn build

      # --- 3. ETAPA ELECTRON: GERA O INSTALADOR ---
      - name: Build Electron Installer
        working-directory: ./frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn dist

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-PDV-Assuncao
          path: frontend/dist_electron/*.exe
